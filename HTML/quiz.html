<!DOCTYPE html>
<html>
  <head>
    <title>ASLingo Quiz</title>
    <link rel="stylesheet" href="../CSS/style.css">
  </head>

  <body>
    <h1>
      <img src="../ASLingoLogo.png" width="500">
    </h1>

    <b id="score">Correct: 0</b>

    <iframe id="video" width="500" height="300"></iframe>

    <p id="question"></p>

    <div class="answers">
        <button id="right">Hello</button>
        <button id="wrong1">Github</button>
        <button id="wrong2">Computer Science</button>
        <button id="wrong3">FastAPI</button>
    </div>
    
    <script src="aslingo.js"></script>
    <script src="quiz.js"></script>
    <script type="module">
        import { Quiz } from "../JAVASCRIPT/quiz.js";
        import { ASLSignsLibrary } from "../JAVASCRIPT/aslingo.js";
      
        const quiz = new Quiz(1, 1);
        const question = quiz.getQuizQuestions;
        const score = document.getElementById("score");

        document.getElementById("question").textContent = question.getQuestionText;
        document.getElementById("video").src = 
            ASLSignsLibrary[question.getId - 1].sources[0].replace("watch?v=", "embed/");
        
        const right = document.getElementById("right");
        right.textContent = question.getAnswer;

        const wrong1 = document.getElementById("wrong1");
        const wrong2 = document.getElementById("wrong2");
        const wrong3 = document.getElementById("wrong3");

        wrong1.textContent = question.getWrongAnswers[0];
        wrong2.textContent = question.getWrongAnswers[1];
        wrong3.textContent = question.getWrongAnswers[2];

        right.onclick = function() {
            quiz.correct = quiz.correct + 1;
            
            right.classList.add("rightbutton");
            setTimeout(function() {
                right.classList.remove("rightbutton");
            }, 250)
            console.log("correct: ", quiz.getCorrect);
            score.textContent = "Correct: " + quiz.getCorrect;
        }

        wrong1.onclick = function() {
            wrong1.classList.add("wrongbutton");
            setTimeout(function() {
                wrong1.classList.remove("wrongbutton");
            }, 250)
            console.log("wrong");
        }
        wrong2.onclick = function() {
            wrong2.classList.add("wrongbutton");
            setTimeout(function() {
                wrong2.classList.remove("wrongbutton");
            }, 250)
            console.log("wrong");
        }
        wrong3.onclick = function() {
            wrong3.classList.add("wrongbutton");
            setTimeout(function() {
                wrong3.classList.remove("wrongbutton");
            }, 250)
            console.log("wrong");
        }

        
    </script>

  </body>
</html>
