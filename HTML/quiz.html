<!DOCTYPE html>
<html>
  <head>
    <title>ASLingo Quiz</title>
    <link rel="stylesheet" href="../CSS/style.css">
  </head>

  <body>
    <h1>
      <img src="../ASLingoLogo.png" width="500">
    </h1>

    <b id="score">Correct: 0</b>

    <iframe id="video" width="500" height="300"></iframe>

    <p id="question"></p>

    <div class="answers">
        <button id="right">Hello</button>
        <button id="wrong1">Github</button>
        <button id="wrong2">Computer Science</button>
        <button id="wrong3">FastAPI</button>
    </div>
    <button id="finish">Finish Quiz</button>
    
    
    <script type="module">
        import { Quiz } from "../JAVASCRIPT/quiz.js";
        import { ASLSignsLibrary } from "../JAVASCRIPT/aslingo.js";
      
        const quiz = new Quiz(1, 5);
        let currentQuestionIndex = 0;
        let question = quiz.getQuizQuestions[currentQuestionIndex];
      
        const score = document.getElementById("score");

        const right = document.getElementById("right");
        const wrong1 = document.getElementById("wrong1");
        const wrong2 = document.getElementById("wrong2");
        const wrong3 = document.getElementById("wrong3");
        const answerButtons = [right, wrong1, wrong2, wrong3];
        
        function displayQuestion() {
            document.getElementById("question").textContent = question.getQuestionText;
            document.getElementById("video").src = 
                ASLSignsLibrary[question.getId - 1].sources[0].replace("watch?v=", "embed/");
          //replaces old code with ranomizer and array using same consts
          for(let i = 0; i < answerButtons.length; i++) {
            answerButtons[i].textContent = question.getAnswerSelection[i];
            answerButtons[i].disabled = false;
          }
        }
      
        displayQuestion();

        function nextQuestion() {
            currentQuestionIndex++;

            if (currentQuestionIndex < quiz.getQuizQuestions.length) {
                question = quiz.getQuizQuestions[currentQuestionIndex];
                displayQuestion();
            } else {
                quiz.finalGrade();

                document.getElementById("question").textContent =
                    "Quiz Complete! Score: " + quiz.getCorrect + "/5 (" + quiz.getResult + "%)";

                document.getElementById("video").style.display = "none";
                right.style.display = "none";
                wrong1.style.display = "none";
                wrong2.style.display = "none";
                wrong3.style.display = "none";
              }
        }
      
        //added new logic to prevent answer being "wrong1,2,3"
      answerButtons.forEach(function(button) {
        button.onclick = function() {
          const selectedAnswer = button.textContent;
          const isCorrect = selectedAnswer == question.getAnswer;
          //prevent double tapping answers
          answerButtons.forEach(btn => btn.disabled = true);
          if (isCorrect){
            quiz.setCorrect = quiz.getCorrect + 1;
            button.classList.add("rightbutton");
            score.textContent = "Correct: " + quiz.getCorrect;
          } else {
            button.classList.add("wrongbutton");
          }
          setTimeout(function() {
            button.classList.remove("rightbutton");
            button.classList.remove("wrongbutton");
            nextQuestion();
          }, 500);
        };
      });

    
        document.getElementById("finish").onclick = function() {
            if (!window.confirm("Finish this quiz?")) {
                return;
            }
            quiz.finalGrade();
        
            var history = JSON.parse(localStorage.getItem("quizHistory")) || [];
        
            history.push(quiz.getResult);
        
            localStorage.setItem("quizHistory", JSON.stringify(history));
        
            window.location.href = "history.html";
        }
    
            
    </script>

  </body>
</html>
